<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- App icon source, rendered by scripts/generate-icons.mjs (`npm run icons`).
       Colors from the misty sky background: pale blue ground, peach sun, navy cup.
       The ids are used by the script to derive the small favicon variant. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e6f2"/>
      <stop offset="1" stop-color="#eee6ea"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd4bb"/>
      <stop offset="1" stop-color="#f39b8c"/>
    </linearGradient>
  </defs>
  <rect id="background" width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#sun)"/>
  <circle id="ring" cx="256" cy="256" r="178" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="4"/>
  <g id="cup" fill="none" stroke="#0a2433" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
    transform="translate(256 256) scale(0.62) translate(-257 -277)">
    <path d="M155 222 H317 V298 A74 74 0 0 1 243 372 H229 A74 74 0 0 1 155 298 Z"/>
    <path d="M317 246 H339 A35 35 0 0 1 339 316 H317"/>
    <path d="M140 414 H332"/>
    <path d="M207 140 C 193 156, 221 168, 207 184 M265 140 C 251 156, 279 168, 265 184"/>
  </g>
</svg>
