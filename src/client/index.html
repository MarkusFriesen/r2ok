    <!-- App shell placeholder, shown until React replaces the content of #root -->
    <style>
      /* On body, not html, so it still propagates to the canvas below the backdrop in App.css */
      body { margin: 0; background-color: #eef3f7; }
      .boot { padding: calc(12px + env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) 0 max(15px, env(safe-area-inset-left)); }
      .boot-nav { width: 228px; height: 56px; margin: 0 auto 30px; border-radius: 999px; }
      .boot-cards { display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); gap: 30px; align-items: start; }
      .boot-nav, .boot-cards > div {
        background: rgba(255, 255, 255, 0.55) linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%) 0 0 / 200% 100%;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 40px rgba(10, 36, 51, 0.08);
        animation: boot-shimmer 1.4s linear infinite;
      }
      .boot-cards > div { height: 260px; border-radius: 24px; }
      .boot-cards > div:nth-child(2n) { height: 340px; }
      .boot-cards > div:nth-child(3n) { height: 200px; }
      @media (min-width: 750px) { .boot-cards { --cols: 2; } }
      @media (min-width: 1280px) { .boot-cards { --cols: 3; } }
      @media (min-width: 1920px) { .boot-cards { --cols: 4; } }
      @keyframes boot-shimmer { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-nav, .boot-cards > div { animation: none; } }
    </style>
